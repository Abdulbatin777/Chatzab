services:
  - type: web
    name: chatzab
    runtime: node
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CHATZAB_ORIGINS
        sync: false
      - key: SESSION_DAYS
        value: 30
      - key: MAX_UPLOAD_MB
        value: 10
